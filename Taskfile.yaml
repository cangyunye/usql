# Taskfile for building usql.
#
# Cross-platform task runner (github.com/go-task/task). Tested with task v3.
#   task build      -> build the test driver set (CGO-free, pure Go)
#   task build:cgo  -> build with CGO enabled (mattn sqlite3, resvg, duckdb)
#   task drivers    -> show the drivers compiled into the binary
#   task clean      -> remove built artifacts
#
# The driver set below covers: oceanbase (mysql), oboracle (OceanBase Oracle),
# opengauss, mysql, postgres, oracle, plus a pure-Go sqlite (moderncsqlite).
# Tune DRIVERS with `task build DRIVERS="postgres mysql"` if you want less.

version: "3"

env:
  CGO_ENABLED: "0"

vars:
  BIN: usql
  # CGO-free, no-C-driver test set. no_* excludes base drivers not wanted.
  DRIVERS: >-
    postgres mysql oracle opengauss oboracle
    no_sqlite3 no_sqlserver no_clickhouse no_csvq moderncsqlite

tasks:
  default:
    desc: Build usql with the test driver set (CGO-free, pure Go)
    cmds:
      - go build -tags "{{.DRIVERS}}" -o {{.BIN}} .

  build:
    desc: Alias of default (CGO-free test driver set)
    cmds:
      - task: default

  build:cgo:
    desc: Build with CGO enabled (mattn sqlite3, resvg chart, duckdb)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -tags "{{.DRIVERS | replace \"no_sqlite3 moderncsqlite\" \"sqlite3\"}}" -o {{.BIN}} .

  drivers:
    desc: List the drivers compiled into the built binary
    cmds:
      - printf '\\drivers\n\\q\n' | ./{{.BIN}}

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f {{.BIN}}
